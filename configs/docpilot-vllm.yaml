llm:
  enabled: true
  provider: openai
  model: docpilot-4b_onestage
  base_url: ""
  api_key: ""
  temperature: 0.0
  max_tokens: null
  timeout: 600
  max_attempts: 2
  seed: 7
  reasoning: disabled
  protocol: vllm_tags
  response_format: ""

budget:
  max_steps: 32
  max_search_calls: null
  max_extract_calls: null
  max_compute_calls: null
  image_type: jpeg

navigate:
  top_k: null
  modal: image
  page_thumbnail_size: 512
  image_page_set_size: 5
  max_tokens: null

extract:
  if_enhanced: false
  max_pages: 4

output:
  show_state: false
  document_dir: runs/environment
  logs_dir: runs/logs
  outputs_dir: runs/outputs
  workspace_dir: runs/.workspace
