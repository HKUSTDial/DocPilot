[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docpilot"
version = "0.1.0"
description = "DocPilot: DocVQA multi-agent orchestration and QA synthesis framework."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.1",
  "tqdm>=4.66.0",
  "openai>=1.0.0",
  "httpx>=0.27.0",
  "mineru[all]>=2.5.0",
  "cuda-toolkit[nvcc]==13.0.3.0; sys_platform == 'linux'",
  "python-dotenv>=1.0.0",
  "requests>=2.31.0",
  "tiktoken>=0.7.0",
]

[project.scripts]
docpilot = "app.cli:main"
docpilot-document = "pipelines.document.cli:main"

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "pipelines*"]
